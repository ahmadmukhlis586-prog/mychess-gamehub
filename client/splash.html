<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyChess GameHub</title>
    <style>
        :root {
            --bg-color: #07050a;
            --accent-color: #a855f7;
            --accent-glow: #9333ea;
            --text-color: #ffffff;
            --subtext-color: #7e7694;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Purple Glow */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Grid Animation */
        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(168, 85, 247, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(55deg) translateY(-80px);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: rotateX(55deg) translateY(0); }
            100% { transform: rotateX(55deg) translateY(50px); }
        }

        .splash-container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-box {
            width: 88px;
            height: 88px;
            border: 2px solid var(--accent-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            background: rgba(168, 85, 247, 0.04);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
            animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1), pulseGlow 2.5s ease-in-out infinite alternate;
        }

        .logo-box svg {
            width: 48px;
            height: 48px;
            fill: var(--accent-color);
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6));
        }

        .title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 0.7s ease-out 0.3s forwards;
        }

        .title span {
            color: var(--accent-color);
            text-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--subtext-color);
            letter-spacing: 7px;
            text-transform: uppercase;
            margin-top: 6px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 0.7s ease-out 0.5s forwards;
        }

        .loader-bar {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.6s forwards;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            box-shadow: 0 0 14px var(--accent-color);
            animation: fillProgress 5.5s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
        }

        .audio-widget {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
        }

        .audio-widget span {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: var(--subtext-color);
        }

        @keyframes scaleIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes pulseGlow { from { box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); } to { box-shadow: 0 0 40px rgba(168, 85, 247, 0.5); } }
        @keyframes fillProgress { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="splash-container">
        <div class="logo-box">
            <svg viewBox="0 0 24 24">
                <path d="M19 22H5V20H19V22M17 10C15.9 10 15 9.1 15 8C15 7.4 15.3 6.8 15.7 6.4L13.8 3.5L12 6.2L10.2 3.5L8.3 6.4C8.7 6.8 9 7.4 9 8C9 9.1 8.1 10 7 10C6.8 10 6.6 10 6.4 9.9L7.9 18H16.1L17.6 9.9C17.4 10 17.2 10 17 10Z"/>
            </svg>
        </div>
        <h1 class="title">MyChess <span>GameHub</span></h1>
        <p class="subtitle">Play & Compete</p>
        
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <div class="audio-widget" onclick="toggleAudio()">
        <span id="audioStatusText">AUDIO: OFF</span>
    </div>

    <script>
        // Redirects to your main index.html after 6 seconds
        setTimeout(() => {
            window.location.href = "index.html"; 
        }, 6000);

        function toggleAudio() {
            const audioText = document.getElementById('audioStatusText');
            audioText.innerText = audioText.innerText === "AUDIO: OFF" ? "AUDIO: ON" : "AUDIO: OFF";
            audioText.style.color = audioText.innerText === "AUDIO: ON" ? "#a855f7" : "#7e7694";
        }
    </script>
</body>
</html>
